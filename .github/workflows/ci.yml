# CI: every pull request (and main) must pass format check, lint, and tests.
#
# One job per workspace component so each appears as its own required status
# check; `gen` is the only one today, with the legacy warehouse and lakehouse
# phases adding theirs later. Deliberately written out rather than expressed
# as a matrix — a matrix renames the status checks, which silently detaches
# any branch-protection rule that requires a check by name.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the previous, now-obsolete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gen
    steps:
      # Major version pinned; bumped when runners deprecate the Node runtime
      # that older action versions target.
      - uses: actions/checkout@v5

      # Version pinned to match local dev, and so setup-uv never has to ask
      # the GitHub API for "latest" — an outage there is an avoidable way to
      # fail a build that has nothing to do with our code.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"

      # --locked: fail if uv.lock is out of sync with pyproject.toml, so CI
      # always tests exactly the pinned dependency set rather than quietly
      # resolving a newer one.
      - name: Install dependencies
        run: uv sync --locked

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest

      # End-to-end smoke: the unit tests exercise the generators directly, so
      # nothing else would catch a broken console-script entry point or an
      # argument-parsing regression. Small scale keeps it to a few seconds.
      - name: Generate (smoke)
        run: uv run intus-gen generate --scale small --seed 1 --out /tmp/intus-smoke

      # The catalog is generated from the schemas, so a committed copy can go
      # stale the moment a column is added. Regenerating and diffing makes
      # that a build failure rather than a documentation bug nobody notices.
      - name: Catalog is up to date
        run: |
          uv run intus-gen catalog --out ../docs/data-catalog.md
          git diff --exit-code -- ../docs/data-catalog.md

  warehouse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warehouse
    # The warehouse tests apply real migrations and COPY real extracts into a
    # real Postgres; a service container gives CI the database that docker
    # compose provides locally. Credentials mirror infra/docker-compose.yml.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: intus
          POSTGRES_PASSWORD: intus_local_dev
          POSTGRES_DB: intus
        ports:
          # Mapped to 5433 to match the local default, so INTUS_PG_DSN below is
          # the same string a developer would use.
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U intus -d intus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      INTUS_PG_DSN: postgresql://intus:intus_local_dev@127.0.0.1:5433/intus
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"

      - name: Install dependencies
        run: uv sync --locked

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      # -rs so a skipped DB test is visible in the log. The suite skips itself
      # when no Postgres is reachable, which is right locally and wrong here —
      # in CI the service container exists, so a skip means something broke.
      - name: Tests
        run: uv run pytest -rs

      # End-to-end against the service container: generate an extract, apply
      # migrations, load it. Exercises the console scripts and the real COPY
      # path, which the unit tests reach only through library calls.
      - name: Migrate and load (smoke)
        run: |
          uv run --directory ../gen intus-gen generate --scale small --seed 7 --out /tmp/extract
          uv run intus-wh migrate
          uv run intus-wh load --from /tmp/extract
          uv run intus-wh status
